<title>Darul Uloom @ Darus Salaam</title>
<style>
:root{
  --g:#14453a;--g2:#1d5c4c;--g3:#e8efe9;--gold:#C9A227;--gold2:#B8860B;--goldbg:#fbf4dc;--goldink:#5a4100;--base:#0d1f1a;--bg:#f3f6f4;--card:#fff;--ink:#13201c;--muted:#56665f;--line:#dde5e1;
  --p:#16794a;--pbg:#e1f3e8;--l:#9a5600;--lbg:#fff0d4;--a:#b42318;--abg:#fde6e3;--v:#3446a8;--vbg:#e6e9fc;--n:#56665f;--nbg:#edf1ef;
  --r:14px;--sh:0 1px 2px rgba(16,40,32,.06),0 4px 14px rgba(16,40,32,.06);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.hidden{display:none!important}
/* header */
header.top{background:linear-gradient(135deg,#0a1713 0%,#0f2a22 55%,#163d31 100%);color:#fff;border-bottom:3px solid var(--gold);padding:14px 16px 16px;padding-top:max(14px,env(safe-area-inset-top))}
.top-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.crest{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.logo{width:56px;height:56px;border-radius:14px;background:#fff;object-fit:contain;padding:3px;flex:none;box-shadow:0 0 0 2px var(--gold)}
.logo.lg{width:120px;height:120px;border-radius:20px;padding:6px;box-shadow:0 0 0 2px var(--gold),0 6px 18px rgba(0,0,0,.08)}
.brand .tag{font-size:.8rem;color:#e9d48a;letter-spacing:.02em}
.clock b{color:#f3dc8c}
.brand{flex:1;min-width:0}
.brand h1{font-size:1.05rem;margin:0;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.brand .sub{font-size:.8rem;opacity:.85;margin-top:1px}
.clock{text-align:right;font-variant-numeric:tabular-nums}
.clock b{font-size:1.35rem;display:block;line-height:1.1}
.clock span{font-size:.78rem;opacity:.85;display:block}
.clock .hijri{color:#e9d48a;opacity:1}
.hj{color:var(--goldink);font-weight:600}
/* nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(0,0,0,.05)}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;text-decoration:none;color:var(--muted);font-size:.74rem;font-weight:600;min-height:58px;justify-content:center}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current=page]{color:var(--g)}
nav.tabs a[aria-current=page] svg{background:var(--goldbg);box-shadow:inset 0 0 0 1px #e6cf7e;border-radius:99px;padding:2px 12px;width:48px;box-sizing:content-box;margin:-2px 0}
nav.tabs .lock-ic{width:11px;height:11px;margin-left:2px}
main{max-width:1180px;margin:0 auto;padding:16px 14px 100px}
@media(min-width:860px){
  nav.tabs{position:sticky;top:0;bottom:auto;justify-content:center;gap:4px;border-top:0;border-bottom:1px solid var(--line);padding:0 16px;box-shadow:none}
  nav.tabs a{flex:none;flex-direction:row;gap:8px;font-size:.92rem;padding:0 18px;min-height:54px;border-bottom:3px solid transparent}
  nav.tabs a svg{width:20px;height:20px}
  nav.tabs a[aria-current=page]{border-bottom-color:var(--gold)}
  nav.tabs a[aria-current=page] svg{background:none;box-shadow:none;padding:0;width:20px;margin:0;color:var(--gold2)}
  main{padding:24px 24px 60px}
  .brand h1{font-size:1.25rem}
}
/* generic */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line)}
.pad{padding:16px}
h2.title{font-size:1.3rem;margin:4px 0 4px}
p.lead{margin:0 0 14px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 16px;min-height:44px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:#f7faf8}
.btn.primary{background:linear-gradient(180deg,#d4ad34,#C9A227);border-color:#b08a14;color:#1c1503;box-shadow:0 1px 0 rgba(255,255,255,.4) inset}
.btn.primary:hover{background:#B8860B;color:#140f02}
.btn.danger{color:var(--a);border-color:#f2c5bf}
.btn.big{min-height:48px;font-size:1rem;width:100%;border-radius:12px}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.88rem}
.btn svg{width:18px;height:18px}
.input{width:100%;border:1px solid #cbd6d1;border-radius:12px;padding:12px 14px;min-height:48px;background:#fff}
.input:focus{border-color:var(--gold2);outline:3px solid rgba(201,162,39,.25)}
label.f{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin:12px 0 6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-present{color:var(--p);background:var(--pbg)}.s-late{color:var(--l);background:var(--lbg)}.s-absent{color:var(--a);background:var(--abg)}.s-leave{color:var(--v);background:var(--vbg)}.s-notyet,.s-none{color:var(--n);background:var(--nbg)}
.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:1rem;letter-spacing:.02em;position:relative}
.avatar.lg{width:84px;height:84px;font-size:1.7rem}
.avatar.sm{width:38px;height:38px;font-size:.85rem}
.avatar i{position:absolute;right:-1px;bottom:-1px;width:15px;height:15px;border-radius:50%;border:3px solid #fff}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.tnum{font-variant-numeric:tabular-nums}
/* sign-in grid */
.search{position:relative;margin-bottom:14px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.search .input{padding-left:44px;font-size:1.05rem;min-height:54px;border-radius:14px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:16px 10px 14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);min-height:132px}
.tcard:hover{border-color:#a9cbbf}
.tcard .nm{font-weight:650;font-size:.95rem;line-height:1.25}
.tcard .st{font-size:.76rem;color:var(--muted)}
@media(max-width:420px){.tgrid{grid-template-columns:1fr 1fr}}
.greet{display:flex;align-items:flex-end;gap:10px;margin-bottom:12px;flex-wrap:wrap}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,25,20,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .2s ease-out}
@media(min-width:600px){.overlay{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}@keyframes fade{from{opacity:0}}
.sheet h3{margin:6px 0 2px;font-size:1.3rem}
.sheet .center{text-align:center;display:flex;flex-direction:column;align-items:center}
.close-x{float:right;border:0;background:var(--nbg);border-radius:50%;width:40px;height:40px;display:grid;place-items:center}
.ok-ic{width:76px;height:76px;border-radius:50%;background:var(--pbg);color:var(--p);box-shadow:0 0 0 3px var(--gold);display:grid;place-items:center;margin:6px auto 8px}
.ok-ic svg{width:40px;height:40px}
.bigtime{font-size:2.6rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;width:100%}
.kv div{background:var(--bg);border-radius:12px;padding:10px 12px;text-align:left}

.etab{width:100%;border-collapse:collapse;font-size:.88rem}.etab th{text-align:left;font-size:.78rem;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}.etab td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}.etab .r{text-align:right;white-space:nowrap}.etab tfoot td{border-bottom:0}

@media(max-width:600px){.sumcards{grid-template-columns:1fr 1fr}.sumcards .scard:last-child{grid-column:span 2}}

.scard span{display:block;font-size:.78rem;font-weight:700;color:var(--muted)}.scard b{display:block;font-size:1.35rem;margin:2px 0}.scard small{color:var(--muted)}
.scard.warn{border-top-color:#d9a400}.scard.alert{border-top-color:var(--a)}.scard.alert small{color:var(--a);font-weight:700}
.more-li{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;padding:16px;text-decoration:none;color:var(--ink);border-top:1px solid var(--line);position:relative}
.list li:first-child .more-li{border-top:0}.more-li b{width:100%}.more-li .chev{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:1.4rem;color:var(--muted)}

}

<script>
(function(){
"use strict";
var TZ='Africa/Johannesburg', KEY='staffRegister.v2', BUILD='school-v7';
var TEACHERS=["Ahmed Jeewa","Asaamu","Asad Mohammed Msiza","Fahima Mayet","Imraan Joosub","Khalid Ayob","Mahmood Desai","Mohamed Elsayed Atia","Mohamed Naeem Nombewu","Mohammad Hoosein Akhalwaya","Muhammad Ashraf E Dockrat","Muhammad Binyamin","Muhammed Desai","Muhammed S dockrat","Nafisa Amod","Nazreen Dada","Samir Mall","Sumaiya Cassim","Yusuf Suliman","Zubair Ismail"];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var COLORS=['#0f6b5a','#2f6f9f','#7a4fa0','#a0522d','#3b7d3b','#b0466a','#5a6b2f','#2b5d8a','#8a5a00','#4b5aa8'];
var STATUS_LABEL={present:'Present',late:'Late',absent:'Absent',leave:'On leave',notyet:'Not captured',none:'—'};
var REASONS=['Sick','Family responsibility','Annual','Other'];
var DEF_NAME='Darul Uloom @ Darus Salaam', DEF_TAG='For Higher Islamic Education';
var S, view={}, adminOk=sessionStorage.getItem('adminOk')==='1';
window.__BUILD=BUILD;

/* ---------- time helpers (always South Africa time) ---------- */
function now(){
  var p={};new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).forEach(function(x){p[x.type]=x.value});
  var h=p.hour==='24'?'00':p.hour;
  return {date:p.year+'-'+p.month+'-'+p.day,time:h+':'+p.minute};
}
function pd(s){var a=s.split('-');return new Date(Date.UTC(+a[0],+a[1]-1,+a[2]))}
function iso(d){return d.toISOString().slice(0,10)}
function addDays(s,n){var d=pd(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)}
function dow(s){return pd(s).getUTCDay()}
function fmtDate(s){var a=s.split('-');return a[2]+' '+MON[+a[1]-1]+' '+a[0]}
function fmtDateW(s){return DOW[dow(s)]+' '+fmtDate(s)}
function isSchoolDay(s){return S.settings.days.indexOf(dow(s))>-1}
function today(){return now().date}
function stamp(){var n=now();return fmtDate(n.date)+' '+n.time}
function toMin(t){var a=t.split(':');return +a[0]*60+ +a[1]}
function fromMin(m){m=Math.max(0,Math.min(1439,Math.round(m)));return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function initials(n){var w=n.trim().split(/\s+/);return (w[0][0]+(w.length>1?w[w.length-1][0]:(w[0][1]||''))).toUpperCase()}
function firstName(n){return n.split(' ')[0]}
function avatar(t,cls,dot){return '<span class="avatar '+(cls||'')+'" style="background:'+COLORS[t.id%COLORS.length]+'" aria-hidden="true">'+esc(initials(t.name))+(dot?'<i style="background:'+dot+'"></i>':'')+'</span>'}
var HMON=['Muharram','Safar','Rabi al-Awwal','Rabi al-Thani','Jumada al-Ula','Jumada al-Akhirah','Rajab','Shaban','Ramadan','Shawwal','Dhu al-Qadah','Dhu al-Hijjah'];
var HFMT=(function(){var cs=['islamic-umalqura','islamic','islamic-civil'];for(var i=0;i<cs.length;i++){try{var f=new Intl.DateTimeFormat('en-u-ca-'+cs[i],{timeZone:'UTC',day:'numeric',month:'numeric',year:'numeric'});if(f.resolvedOptions().calendar===cs[i])return f}catch(e){}}return null})();
var HFEED=null;try{HFEED=JSON.parse(localStorage.getItem('hijriFeed'))}catch(e){}
function intlH(s,adj){if(!HFMT)return null;var d=pd(s);d.setUTCDate(d.getUTCDate()+(adj||0));d.setUTCHours(12);var o={};HFMT.formatToParts(d).forEach(function(x){o[x.type]=x.value});return {d:+o.day,m:+o.month,y:parseInt(o.year,10)}}
function dayDiff(a,b){return Math.round((pd(b)-pd(a))/864e5)}
function feedOk(){var J=HFEED;return J&&J.gregorian&&J.day&&J.year&&J.monthIndex>=1&&J.monthIndex<=12}
function hijriFromFeed(s){
  if(!feedOk())return null;var J=HFEED,k=dayDiff(J.gregorian,s);
  if(k===0)return {d:J.day,m:J.monthIndex,y:J.year};
  if(k<0||k>3)return null;
  for(var dd=-3;dd<=3;dd++){var p=intlH(J.gregorian,dd);if(p&&p.d===J.day&&p.m===J.monthIndex&&p.y===J.year)return intlH(s,dd)}
  return null;
}
function hparts(s){return hijriFromFeed(s)||intlH(s,(S&&S.settings&&S.settings.hijriAdj)||0)}
function hijri(s){var h=hparts(s);return h?h.d+' '+HMON[h.m-1]+' '+h.y:''}
function hijriRange(a,b){var x=hparts(a),y=hparts(b);if(!x||!y)return '';if(x.y===y.y)return x.d+' '+HMON[x.m-1]+' – '+y.d+' '+HMON[y.m-1]+' '+y.y;return hijri(a)+' – '+hijri(b)}
function loadHijriFeed(){
  if(!/^https?:/.test(location.protocol)||!window.fetch)return;
  fetch('hijri.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){
    if(!j||!j.gregorian||!j.day||!j.monthIndex)return;
    var o=JSON.stringify(HFEED);HFEED={gregorian:j.gregorian,day:+j.day,monthIndex:+j.monthIndex,year:+j.year,fetchedAt:j.fetchedAt||''};
    localStorage.setItem('hijriFeed',JSON.stringify(HFEED));
    if(JSON.stringify(HFEED)!==o){header();if(!$('#modalRoot').innerHTML&&view.name!=='settings'){var y=window.scrollY;route();window.scrollTo(0,y)}}
  }).catch(function(){});
}
function keeper(){return S.settings.keeper||'Register keeper'}
function prevSchoolDay(d){for(var i=0;i<14;i++){d=addDays(d,-1);if(isSchoolDay(d))return d}return null}

/* ---------- storage ---------- */
function oldClasses(x){var c=x&&x.classes;return !c||!c.length||(c.length===10&&c.every(function(k,i){return k.name==='Class '+(i+1)}))||c.some(function(k){return k.learners.some(function(l){return l.name==='Zainab Akoob'||l.name==='Nabeel Bham'})})&&!c.some(function(k){return k.name==='1st Year'})}
var PILL={t:0,h:0};
function pillSync(id,show){var b=$('#'+id);if(!b)return;clearTimeout(PILL.h);
  if(show){b.textContent='Save';b.classList.remove('done');b.classList.add('show');return}
  if(Date.now()-PILL.t<2000){PILL.t=0;b.textContent='Saved ✓';b.classList.add('done','show');PILL.h=setTimeout(function(){b.classList.remove('show')},1300);return}
  b.classList.remove('show','done')}
(function(){var mq=window.matchMedia('(max-width:859px)'),lastY=window.scrollY,acc=0,tick=false;
  function upd(){tick=false;var y=Math.max(0,window.scrollY),dy=y-lastY;lastY=y;
    if(!mq.matches||y<24||document.querySelector('#modalRoot .overlay')){document.body.classList.remove('nav-hidden');acc=0;return}
    if((dy>0&&acc<0)||(dy<0&&acc>0))acc=0;acc+=dy;
    if(acc>14)document.body.classList.add('nav-hidden');else if(acc<-6)document.body.classList.remove('nav-hidden')}
  window.addEventListener('scroll',function(){if(!tick){tick=true;requestAnimationFrame(upd)}},{passive:true});
  window.addEventListener('hashchange',function(){document.body.classList.remove('nav-hidden');acc=0},{passive:true});
})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Storage is full – remove some photos')}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}if(!S||!S.teachers)seed();var d=defaults();for(var k in d)if(S.settings[k]==null)S.settings[k]=d[k];S.saved=S.saved||{};if(!S.boarding){seedBoarding();save()}if(!S.school){seedSchool();save()}else if(oldClasses(S.school)){var tm=S.school.term,sj=S.school.subjects;seedSchool();if(tm)S.school.term=tm;if(sj&&sj.length)S.school.subjects=sj;save()}if(!S.ops){seedOps();save()}}
function defaults(){return {schoolName:DEF_NAME,tagline:DEF_TAG,keeper:'Joosy',start:'07:30',late:'07:45',days:[1,2,3,4,5],selfSignIn:false,pinOn:false,requirePin:false,adminPin:'1234',trackOut:false,hijriAdj:0,boardingRoll:false}}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seed(){
  var r=rng(20261022), t0=today();
  S={v:2,demo:true,settings:defaults(),teachers:TEACHERS.map(function(name,i){return{id:i,name:name,pin:String(1000+((i*7919+137)%9000)).slice(-4)}}),records:{},saved:{}};
  var start=addDays(t0,-21); S.startDate=start;
  var lateProne={2:.28,8:.22,13:.25,16:.18}, planned={};
  function plan(back,tid,o){var d=addDays(t0,-back);(planned[d]=planned[d]||{})[tid]=o}
  plan(20,4,{status:'leave',reason:'Sick',note:'Flu – doctor\'s note received'});plan(19,4,{status:'leave',reason:'Sick',note:'Flu – doctor\'s note received'});
  plan(14,13,{status:'leave',reason:'Annual',note:'Pre-approved'});plan(13,13,{status:'leave',reason:'Annual',note:'Pre-approved'});plan(12,13,{status:'leave',reason:'Annual',note:'Pre-approved'});
  plan(8,9,{status:'leave',reason:'Family responsibility',note:'Family funeral (janazah)'});
  plan(6,16,{status:'absent',reason:'Other',note:'No contact made'});
  plan(15,11,{status:'absent',reason:'Sick',note:'Phoned in at 06:50'});
  plan(2,6,{status:'leave',reason:'Sick',note:'Doctor\'s note – 3 days'});plan(1,6,{status:'leave',reason:'Sick',note:'Doctor\'s note – 3 days'});
  plan(1,17,{status:'leave',reason:'Family responsibility',note:'Child in hospital'});
  for(var d=start;d<t0;d=addDays(d,1)){
    if(!isSchoolDay(d))continue;
    var day=S.records[d]={};
    S.teachers.forEach(function(t){
      var p=planned[d]&&planned[d][t.id];
      if(p){day[t.id]={status:p.status,reason:p.reason,note:p.note};return}
      if(r()<(lateProne[t.id]||.035))day[t.id]={status:'late',in:fromMin(toMin('07:47')+r()*28)};
      else day[t.id]={status:'present'};
    });
    S.saved[d]={at:fmtDate(d)+' '+fromMin(toMin('07:50')+r()*15),by:'Joosy'};
  }
  var dA=addDays(t0,-5); while(!isSchoolDay(dA))dA=addDays(dA,-1);
  seedBoarding();seedSchool();seedOps();
  if(S.records[dA])S.records[dA][5]={status:'present',audit:[{at:fmtDate(dA)+' 09:12',text:'Late 07:55 → Present · Reason: was on gate duty from 07:15 · by Joosy'}]};
  save();
}
function rec(d,id){return S.records[d]&&S.records[d][id]}
function setRec(d,id,o){(S.records[d]=S.records[d]||{})[id]=o}
function statusOf(d,id){
  var r=rec(d,id);
  if(r&&r.status){if(r.status==='in')return r.in>S.settings.late?'late':'present';return r.status}
  if(d===today())return isSchoolDay(d)?'notyet':'none';
  return 'none';

function monthDays(ym){var a=ym.split('-'),y=+a[0],m=+a[1],out=[];for(var d=1;d<=new Date(Date.UTC(y,m,0)).getUTCDate();d++){var s=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');if(isSchoolDay(s))out.push(s)}return out}

function totals(id,days){var t={P:0,L:0,A:0,Lv:0,n:0};days.forEach(function(d){var st=statusOf(d,id);if(st==='present'||st==='late'){t.P++;t.n++;if(st==='late')t.L++}else if(st==='absent'){t.A++;t.n++}else if(st==='leave'){t.Lv++;t.n++}});t.pct=t.n?Math.round(t.P/t.n*100):null;return t}

function download(name,text){var b=new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000)}
function csvRow(a){return a.map(function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')}
function slug(){return (S.settings.schoolName||'school').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()}
function exportCSV(detailed){
  var ym=view.ym||today().slice(0,7), days=monthDays(ym), lines=[];

  } else {

    days.forEach(function(d){S.teachers.forEach(function(x){var st=statusOf(d,x.id);if(st==='none'||st==='notyet')return;var r=rec(d,x.id)||{};lines.push(csvRow([fmtDate(d),x.name,STATUS_LABEL[st],r.in,r.out,r.reason,r.note,r.audit&&r.audit.length?r.audit[r.audit.length-1].text:'']))})});
  }

  download(name,lines.join('\r\n'));toast('Downloaded '+name);

  else if(el.dataset.cteach!=null){cls(+el.dataset.cteach).teacher=+el.value}
  else if(el.id==='sTrackOut')s.trackOut=el.checked;
  else if(el.id==='sSelf'){s.selfSignIn=el.checked;rerender=true}
  else if(el.id==='sReqPin'){s.requirePin=el.checked;if(el.checked){adminOk=true;sessionStorage.setItem('adminOk','1')}rerender=true}
  else if(el.id==='sPin'){s.pinOn=el.checked;$('#pinList').classList.toggle('hidden',!el.checked)}
  else if(el.dataset.pin!=null){if(/^\d{4}$/.test(el.value))S.teachers[+el.dataset.pin].pin=el.value;else{toast('PIN must be 4 digits');el.value=S.teachers[+el.dataset.pin].pin;return}}
  else if(el.id==='sAdmin'){if(/^\d{4}$/.test(el.value))s.adminPin=el.value;else{toast('PIN must be 4 digits');el.value=s.adminPin;return}}
  else return;

}

  var B=S.boarding,cur=sickNow(),past=B.sick.filter(function(s){return s.cleared}).sort(function(a,b){return b.cleared.localeCompare(a.cleared)});
  $('#bBody').innerHTML='<div class="row" style="margin:4px 0 12px"><b style="flex:1">In sick bay now ('+cur.length+')</b><button class="btn primary" data-bact="newSick">+ Admit to sick bay</button></div>'+
   (cur.length?'<div class="pass-grid">'+cur.map(function(s){var l=L(s.lid);return '<div class="card pad pass sick"><div class="row" style="gap:10px;flex-wrap:nowrap">'+bAvatar(l)+'<div style="flex:1"><b>'+esc(l.name)+'</b><div class="muted small">'+l.dorm+' · since '+fmtDT(s.in)+'</div></div><span class="chip s-late">Sick bay</span></div><dl class="pdl"><dt>Complaint</dt><dd>'+esc(s.complaint)+'</dd><dt>Action taken</dt><dd>'+esc(s.action)+'</dd><dt>Parent notified</dt><dd><label class="mini-sw"><input type="checkbox" data-sick-notify="'+s.id+'"'+(s.notified?' checked':'')+'> '+(s.notified?'Yes':'No')+'</label></dd></dl><div class="row"><button class="btn primary" style="flex:1" data-bact="clearSick" data-id="'+s.id+'">Cleared – back to dorm</button>'+waBtn(l,msgSick(s),'WhatsApp')+'</div></div>'}).join('')+'</div>':'<p class="muted">Sick bay is empty.</p>')+
   '<h3 style="margin:22px 0 8px;font-size:1rem">Sick bay log</h3><div class="card"><ul class="list">'+(past.length?past.map(function(s){var l=L(s.lid);return '<li class="li">'+bAvatar(l)+'<div class="who"><b>'+esc(l.name)+'</b><div class="times">'+esc(s.complaint)+' · '+esc(s.action)+'</div><div class="times">In '+fmtDT(s.in)+' · cleared '+fmtDT(s.cleared)+' · parent notified: '+(s.notified?'yes':'no')+'</div></div></li>'}).join(''):'<li class="li muted">No earlier entries</li>')+'</ul></div>';
}
function openNewSick(){var ids=sickNow().map(function(s){return s.lid}),outIds=outNow().map(function(p){return p.lid});
  modal(X+'<h3>Admit to sick bay</h3><label class="f" for="sL">Learner</label><select class="input" id="sL">'+learnerOptions(function(l){return ids.indexOf(l.id)<0&&outIds.indexOf(l.id)<0})+'</select><label class="f" for="sC">Complaint</label><input class="input" id="sC" maxlength="100" placeholder="e.g. Headache, high temperature"><label class="f" for="sA">Action taken</label><input class="input" id="sA" maxlength="140" placeholder="e.g. Panado, rest, temperature checked"><div class="switch"><div><b>Parent notified</b></div><input type="checkbox" id="sN" aria-label="Parent notified"></div><div class="row" style="margin-top:12px;flex-wrap:nowrap"><button class="btn" data-act="close" style="flex:1">Cancel</button><button class="btn primary" data-bact="saveSick" style="flex:2">Admit</button></div>')}
function saveSick(){var c=$('#sC').value.trim(),a=$('#sA').value.trim();if(!c){toast('Please enter the complaint');return}var s={id:Date.now(),lid:+$('#sL').value,complaint:c,action:a||'Observation',notified:$('#sN').checked,in:nowDT(),cleared:null};S.boarding.sick.push(s);save();view.bd=null;closeModal();toast(L(s.lid).name+' admitted to sick bay');renderBoarding()}
/* kitchen */
function kitchenCalc(){
  var B=S.boarding,tm=addDays(today(),1),total=B.learners.length;
  return MEALS.map(function(m){var at=tm+' '+m[1],away=[];
    outNow().forEach(function(p){var od=isOverdue(p);if(od||p.due>at)away.push({p:p,od:od})});
    return {meal:m[0],time:m[1],count:total-away.length,away:away};
  });
}
function bKitchen(){
  var tm=addDays(today(),1),rows=kitchenCalc(),total=S.boarding.learners.length,sk=sickNow().length,dueBack=outNow().filter(function(p){return !isOverdue(p)&&p.due<=tm+' 18:30'});
  $('#bBody').innerHTML='<div class="card pad" style="margin-top:4px"><div class="row"><div style="flex:1"><b>Tomorrow · '+fmtDateW(tm)+'</b><div class="muted small">Boarders expected per meal</div></div><button class="btn" data-bact="copyKitchen">Copy for kitchen</button></div>'+
   '<div class="meals">'+rows.map(function(r){return '<div class="meal"><span>'+r.meal+'</span><b class="tnum">'+r.count+'</b><small class="muted">'+r.time+'</small></div>'}).join('')+'</div>'+
   '<h4 style="margin:16px 0 6px">How this is worked out</h4><ol class="logic"><li>Start with all <b>'+total+'</b> boarders.</li>'+
   rows.map(function(r){return '<li><b>'+r.meal+' ('+r.time+')</b>: '+total+(r.away.length?' − '+r.away.length+' away ('+r.away.map(function(a){return esc(L(a.p.lid).name)+(a.od?', overdue – not counted until signed in':', back '+fmtDT(a.p.due))}).join('; ')+')':'')+' = <b>'+r.count+'</b></li>'}).join('')+
   (dueBack.length?'<li>Due back before supper and counted: '+dueBack.map(function(p){return esc(L(p.lid).name)+' ('+fmtDT(p.due)+')'}).join(', ')+'.</li>':'')+
   '<li>Sick bay ('+sk+') included – light meals.</li></ol></div>';
}
function kitchenText(){var tm=addDays(today(),1),r=kitchenCalc();return '*'+school()+' – Kitchen count*\n'+fmtDateW(tm)+'\n\n'+r.map(function(x){return x.meal+' ('+x.time+'): '+x.count}).join('\n')+'\n\nSick bay: '+sickNow().length+' (light meals)\nFrom '+keeper()}
function boardingCard(){
  var B=S.boarding,out=outNow(),od=out.filter(isOverdue).length,sk=sickNow().length,ro=B.rolls[today()],inN=B.learners.length-out.length-sk;
  return '<div class="card pad bcard"><div class="row"><b style="flex:1">Boarding <span class="muted small" style="font-weight:500">· '+(ro?'roll call saved '+ro.at.slice(-5):'tonight\'s roll not taken yet')+'</span></b><a class="btn sm" href="#boarding/roll">Open boarding</a></div><div class="bstats"><a href="#boarding/roll"><b>'+inN+'</b><span>In</span></a><a href="#boarding/passes"><b>'+out.length+'</b><span>Out on pass</span></a><a href="#boarding/passes" class="'+(od?'red':'')+'"><b>'+od+'</b><span>Overdue</span></a><a href="#boarding/sick"><b>'+sk+'</b><span>Sick bay</span></a></div></div>';
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-bact]');if(!b)return;var a=b.dataset.bact,id=b.dataset.id!=null?+b.dataset.id:null;
  switch(a){
    case 'bset':view.bd.items[id]=b.dataset.st;bDraw();break;
    case 'allIn':S.boarding.learners.forEach(function(l){view.bd.items[l.id]='in'});bDraw();toast('Everyone marked in');break;
    case 'bSave':PILL.t=Date.now();bSave();break;
    case 'bday':var nd=addDays(view.bd.d,+b.dataset.d);bChangeDate(nd);break;
    case 'newPass':openNewPass();break;
    case 'savePass':savePass();break;
    case 'passIn':if(confirm('Sign '+L(S.boarding.passes.filter(function(x){return x.id===id})[0].lid).name+' back in now?'))passIn(id);break;
    case 'copyMsg':copyText($('#parentMsg').textContent);break;
    case 'newSick':openNewSick();break;
    case 'saveSick':saveSick();break;
    case 'clearSick':var s=S.boarding.sick.filter(function(x){return x.id===id})[0];s.cleared=nowDT();save();view.bd=null;toast(L(s.lid).name+' cleared from sick bay');renderBoarding();break;
    case 'copyKitchen':copyText(kitchenText());break;
  }
});

var CREASONS=['Sick','Family','Unknown','Other'];
var SUBJECTS_DEFAULT=['Arabic','Fiqh','Hadith','Tafseer','Aqeedah','English','Maths'];
function SC(){return S.school}
function cls(id){return SC().classes[id]}
function lrn(lid){var p=String(lid).split('-');var c=cls(+p[0]);if(!c)return null;for(var i=0;i<c.learners.length;i++)if(c.learners[i].id===lid)return c.learners[i];return null}
function lAv(l,cid){return '<span class="avatar sm" style="background:'+COLORS[(cid*3+7)%COLORS.length]+'" aria-hidden="true">'+esc(initials(l.name))+'</span>'}
function tName(i){return S.teachers[i]?S.teachers[i].name:''}
function seedSchool(){
  var r=rng(777),t0=today();
  var X0={classes:CLASS_DATA.map(function(c,ci){return{id:ci,name:c.name,teacher:c.teacher,learners:c.learners.map(function(n,i){return{id:ci+'-'+i,name:n,phone:''}})}}),reg:{},subjects:SUBJECTS_DEFAULT.slice(),term:'Term 4 2026',assess:[],comments:{},pcomments:{},lastClass:0,nextId:1};
  S.school=X0;
  for(var d=S.startDate||addDays(t0,-21);d<=t0;d=addDays(d,1)){
    if(!isSchoolDay(d))continue;var day=X0.reg[d]={};
    X0.classes.forEach(function(c){
      if(d===t0&&c.id>=6)return;
      var items={};c.learners.forEach(function(l){var x=r();items[l.id]=x<.035?{st:'absent',reason:CREASONS[Math.floor(r()*3)]}:x<.06?{st:'late',in:fromMin(toMin('07:46')+r()*25)}:{st:'present'}});
      day[c.id]={items:items,at:fmtDate(d)+' '+fromMin(toMin('07:48')+r()*30),by:tName(c.teacher)};
    });
  }
  [0,1].forEach(function(ci){var c=X0.classes[ci],ab={};c.learners.forEach(function(l){ab[l.id]=.42+r()*.5});
    X0.subjects.forEach(function(sj,si){[['Test 1',50,-24],['Test 2',100,-8]].forEach(function(a){
      var A={id:X0.nextId++,cid:ci,subj:sj,name:'Term 4 '+a[0],total:a[1],date:addDays(t0,a[2]),term:X0.term,marks:{}};
      c.learners.forEach(function(l){if(r()<.03){A.marks[l.id]=null;return}var p=Math.max(.18,Math.min(1,ab[l.id]+(r()-.5)*.24+((si%3)-1)*.04));A.marks[l.id]=Math.round(p*a[1]*2)/2});
      X0.assess.push(A)})})});
}
function cReg(d,cid){return SC().reg[d]&&SC().reg[d][cid]}
function lSt(d,cid,lid){var g=cReg(d,cid);if(!g)return 'none';return (g.items[lid]||{st:'present'}).st}
function renderClasses(){
  var tab=view.arg||'take';
  var tabs=[['take','Take register'],['overview','Overview'],['monthly','Monthly']];
  $('#main').innerHTML='<div class="take-head no-print"><div><h2 class="title">Classes</h2></div></div><div class="subtabs no-print" role="tablist">'+tabs.map(function(t){return '<a role="tab" href="#classes/'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+t[1]+'</a>'}).join('')+'</div><div id="cBody"></div>';
  ({take:cTake,overview:cOverview,monthly:cMonthly}[tab]||cTake)();
}
function classOptions(sel){return SC().classes.map(function(c){return '<option value="'+c.id+'"'+(c.id===sel?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')}
function cDraftMake(cid,d){var c=cls(cid),sv=cReg(d,cid),items={};c.learners.forEach(function(l){var o=sv&&sv.items[l.id];items[l.id]=o?JSON.parse(JSON.stringify(o)):{st:'present'}});return{cid:cid,d:d,items:items,by:sv?sv.by:tName(c.teacher),base:JSON.stringify(items)}}
function cDirty(){return view.cd&&JSON.stringify(view.cd.items)!==view.cd.base}
function cTake(){
  var cid=view.cCid!=null?view.cCid:(SC().lastClass||0),d=view.cDate||today();
  if(!cls(cid))cid=0;
  if(!view.cd||view.cd.cid!==cid||view.cd.d!==d)view.cd=cDraftMake(cid,d);
  document.body.classList.add('has-bar');
  $('#cBody').innerHTML='<div class="selrow"><select class="input" id="cSel" aria-label="Class">'+classOptions(cid)+'</select><input type="date" class="input date-in" id="cDate" value="'+d+'" max="'+today()+'" aria-label="Date"></div>'+
   '<div class="row" style="margin:8px 0 2px"><div style="flex:1;min-width:0"><b>'+esc(cls(cid).name)+'</b> <span id="cBadge"></span><div class="muted small">'+fmtDateW(d)+' · <span class="hj">'+hijri(d)+'</span></div></div><label class="small muted" for="cBy" style="display:flex;align-items:center;gap:6px">By <select class="input sm-in" id="cBy">'+S.teachers.map(function(t){return '<option'+(t.name===view.cd.by?' selected':'')+'>'+esc(t.name)+'</option>'}).join('')+'</select></label></div>'+
   '<div id="cBanner"></div><div class="tools"><button class="btn sm" data-cact="allP">Mark all present</button></div><ul class="list card take" id="cList"></ul>'+
   '<div class="sb-counts small muted tnum" id="cCounts"></div><button class="savepill" data-cact="save" id="cBtn" type="button">Save</button>';
  $('#cSel').addEventListener('change',function(e){cSwitch(+e.target.value,view.cd.d)});
  $('#cDate').addEventListener('change',function(e){if(e.target.value)cSwitch(view.cd.cid,e.target.value>today()?today():e.target.value)});
  $('#cBy').addEventListener('change',function(e){view.cd.by=e.target.value});
  cDraw();
}
function cSwitch(cid,d){if(cDirty()&&!confirm('Discard unsaved changes?')){cTake();return}view.cCid=cid;view.cDate=d;view.cd=null;SC().lastClass=cid;save();cTake()}
function cCounts(){var c={present:0,late:0,absent:0},it=view.cd.items;for(var k in it)c[it[k].st]++;return c}
function cMsg(l,c,d){return 'Assalamu alaikum. This is '+keeper()+' from '+school()+'.\n\n'+l.name+' ('+c.name+') was marked absent on '+fmtDateW(d)+'.\n\nPlease let us know the reason. JazakAllah khair.'}
function cDraw(){
  var cd=view.cd,c=cls(cd.cid),sv=cReg(cd.d,cd.cid),dt=cDirty(),n=cCounts();
  $('#cBadge').innerHTML=sv?(dt?'<span class="badge b-unsaved">Unsaved changes</span>':'<span class="badge b-saved">✓ Saved</span>'):'<span class="badge b-new">Not saved yet</span>';
  $('#cBanner').innerHTML=sv&&!dt?'<div class="saved-banner slim" role="status"><div class="ok-ic sm">'+CHECK+'</div><div style="flex:1"><b>Saved at '+sv.at.slice(-5)+'</b> <span class="small muted">by '+esc(sv.by)+'</span></div></div>':'';
  $('#cList').innerHTML=c.learners.map(function(l){var o=cd.items[l.id],det='';
    if(o.st==='late')det='Late · '+o.in;else if(o.st==='absent')det='Absent'+(o.reason?' · '+esc(o.reason):'');
    var wa=(o.st==='absent'&&sv&&!dt)?'<a class="wa-mini" target="_blank" rel="noopener" href="'+waLink(l.phone,cMsg(l,c,cd.d))+'" data-wa="1">'+WA+'WhatsApp parent</a>':'';
    return '<li class="tr t-'+o.st+'"><div class="tn">'+lAv(l,cd.cid)+'<div><b>'+esc(l.name)+'</b>'+(det?'<small>'+det+'</small>':'')+wa+'</div></div><div class="seg4 seg3" role="radiogroup" aria-label="'+esc(l.name)+'">'+[['present','P','Present'],['late','L','Late'],['absent','A','Absent']].map(function(b){return '<button role="radio" class="k-'+b[0]+'" data-cact="set" data-id="'+l.id+'" data-st="'+b[0]+'" aria-checked="'+(o.st===b[0])+'" aria-label="'+b[2]+'"><span class="abbr">'+b[1]+'</span><span class="full">'+b[2]+'</span></button>'}).join('')+'</div></li>'}).join('');
  $('#cCounts').innerHTML='<b>'+n.present+' present'+(n.late?' · '+n.late+' late':'')+(n.absent?' · '+n.absent+' absent':'')+'</b><span class="small muted"> · '+c.learners.length+'</span>';
  pillSync('cBtn',!sv||dt);
}
function cSetSt(lid,st){var cd=view.cd,l=lrn(lid);
  if(st==='present'){cd.items[lid]={st:'present'};cDraw();return}
  if(st==='late'){var s=S.settings.start,def=cd.d===today()?now().time:fromMin(toMin(s)+30),q=[['Now',now().time],['+15m',fromMin(toMin(s)+15)],['+30m',fromMin(toMin(s)+30)],['+1h',fromMin(toMin(s)+60)]];
    modal(X+'<h3>'+esc(l.name)+'</h3><div class="muted small">Late arrival</div><label class="f" for="clt">Arrival time</label><input class="input" type="time" id="clt" value="'+(cd.items[lid].in||def)+'" style="font-size:1.3rem;text-align:center"><div class="quick">'+q.map(function(b){return '<button class="btn sm" data-cact="qtc" data-t="'+b[1]+'">'+b[0]+'<small class="muted tnum">'+b[1]+'</small></button>'}).join('')+'</div><div class="row" style="margin-top:16px;flex-wrap:nowrap"><button class="btn" data-act="close" style="flex:1">Cancel</button><button class="btn primary" data-cact="okLate" data-id="'+lid+'" style="flex:2" autofocus>Mark late</button></div>');return}
  view.crs=cd.items[lid].reason||'';
  modal(X+'<h3>'+esc(l.name)+'</h3><div class="muted small">Absent</div><label class="f">Reason (optional)</label><div class="reasons" id="crsGrid">'+CREASONS.map(function(r){return '<button data-cact="rs" data-r="'+r+'" class="'+(r===view.crs?'on':'')+'">'+r+'</button>'}).join('')+'</div><div class="row" style="margin-top:16px;flex-wrap:nowrap"><button class="btn" data-act="close" style="flex:1">Cancel</button><button class="btn primary" data-cact="okAbs" data-id="'+lid+'" style="flex:2" autofocus>Mark absent</button></div>');
}
function cSave(){var cd=view.cd,sv=cReg(cd.d,cd.cid);if(sv&&!cDirty()){toast('Already saved');return}
  if(sv&&!confirm('This register was already saved at '+sv.at.slice(-5)+'. Overwrite it?'))return;
  var log=(sv&&sv.log)||[];if(sv)cls(cd.cid).learners.forEach(function(l){var a=(sv.items[l.id]||{}).st||'present',b=cd.items[l.id].st;if(a!==b)log.push(stamp()+' – '+l.name+': '+a+' → '+b)});
  (SC().reg[cd.d]=SC().reg[cd.d]||{})[cd.cid]={items:JSON.parse(JSON.stringify(cd.items)),at:stamp(),by:cd.by,log:log};
  SC().lastClass=cd.cid;save();view.cd=cDraftMake(cd.cid,cd.d);cTake();window.scrollTo(0,0);toast(cls(cd.cid).name+' register saved');
}
function cOverview(){
  var d=view.cDate||today(),T={present:0,late:0,absent:0,n:0,cap:0,learners:0};
  var rows=SC().classes.map(function(c){var g=cReg(d,c.id),k={present:0,late:0,absent:0},abs=[];T.learners+=c.learners.length;

  var op=openRepairs(),urg=op.filter(function(r){return r.urg==='Urgent'}).length,sp=monthSpend(d.slice(0,7)),nC=SC().classes.length;
  return '<div class="sumcards"><a class="scard'+(cap<nC?' warn':'')+'" href="#classes/overview"><span>Class registers</span><b>'+cap+' of '+nC+'</b><small>'+abs+' learner'+(abs===1?'':'s')+' absent</small></a><a class="scard'+(urg?' alert':'')+'" href="#boarding/repairs"><span>Repairs</span><b>'+op.length+' open</b><small>'+urg+' urgent</small></a><a class="scard" href="#boarding/expenses"><span>Spent this month</span><b class="tnum">'+rand(sp)+'</b><small>'+MONL[+d.slice(5,7)-1]+'</small></a></div>'}
function renderMore(){var it=[['#today','Today','Staff, classes, repairs and spend at a glance'],['#register','Staff monthly register','Grid, print and CSV'],['#settings','Settings','School, hours, classes, subjects']];if(S.settings.selfSignIn)it.unshift(['#signin','Teacher sign-in','Teachers tap their own name']);
  $('#main').innerHTML='<h2 class="title">More</h2><div class="card"><ul class="list">'+it.map(function(x){return '<li><a class="more-li" href="'+x[0]+'"><b>'+x[1]+'</b><span class="small muted">'+x[2]+'</span><span class="chev">›</span></a></li>'}).join('')+'</ul></div>'}
function renderClassSettings(){
  $('#main').innerHTML='<p style="margin:0 0 10px"><a href="#settings" class="back">‹ Settings</a></p><h2 class="title">Classes</h2><p class="lead">Rename a class, set its teacher, or paste a new learner list.</p><div class="pass-grid">'+SC().classes.map(function(c){return '<div class="card pad"><label class="f" for="cn'+c.id+'" style="margin-top:0">Class name</label><input class="input" id="cn'+c.id+'" data-cname="'+c.id+'" value="'+esc(c.name)+'" maxlength="40"><label class="f" for="ct'+c.id+'">Class teacher</label><select class="input" id="ct'+c.id+'" data-cteach="'+c.id+'">'+S.teachers.map(function(t,i){return '<option value="'+i+'"'+(i===c.teacher?' selected':'')+'>'+esc(t.name)+'</option>'}).join('')+'</select><div class="row" style="margin-top:10px"><span class="small muted" style="flex:1">'+c.learners.length+' learners</span><button class="btn sm" data-cact="repl" data-id="'+c.id+'">Replace learners</button></div></div>'}).join('')+'</div>'}
function openReplace(cid){var c=cls(cid);modal(X+'<h3>Learners – '+esc(c.name)+'</h3><p class="small muted" style="margin:0 0 8px">One name per line. Existing names keep their history.</p><textarea class="input" id="replT" rows="12">'+esc(c.learners.map(function(l){return l.name}).join('\n'))+'</textarea><div class="row" style="margin-top:12px;flex-wrap:nowrap"><button class="btn" data-act="close" style="flex:1">Cancel</button><button class="btn primary" data-cact="replOk" data-id="'+cid+'" style="flex:2">Save list</button></div>')}
function replaceLearners(cid){var c=cls(cid),names=$('#replT').value.split(/\r?\n/).map(function(s){return s.replace(/\t.*$/,'').trim()}).filter(Boolean);if(!names.length){toast('The list is empty');return}
  var old={};c.learners.forEach(function(l){old[normName(l.name)]=l});var stamp0=Date.now().toString(36);
  c.learners=names.map(function(n,i){var o=old[normName(n)];return o?{id:o.id,name:n,phone:o.phone}:{id:cid+'-'+stamp0+i,name:n,phone:''}});save();closeModal();renderClassSettings();toast(c.name+': '+names.length+' learners')}
document.addEventListener('click',function(e){var b=e.target.closest('[data-cact],[data-mact],[data-oact]');if(!b)return;var id=b.dataset.id;
  var a=b.dataset.cact||b.dataset.mact||b.dataset.oact;
  switch(a){
    case 'set':cSetSt(id,b.dataset.st);break;
    case 'qtc':$('#clt').value=b.dataset.t;break;
    case 'okLate':var v=$('#clt').value;if(!v){toast('Choose a time');return}view.cd.items[id]={st:'late',in:v};closeModal();cDraw();break;
    case 'rs':view.crs=view.crs===b.dataset.r?'':b.dataset.r;document.querySelectorAll('#crsGrid button').forEach(function(x){x.classList.toggle('on',x.dataset.r===view.crs)});break;
    case 'okAbs':view.cd.items[id]=view.crs?{st:'absent',reason:view.crs}:{st:'absent'};closeModal();cDraw();break;
    case 'allP':cls(view.cd.cid).learners.forEach(function(l){view.cd.items[l.id]={st:'present'}});cDraw();break;
    case 'save':PILL.t=Date.now();cSave();break;
    case 'open':view.cCid=+id;view.cd=null;SC().lastClass=+id;location.hash='#classes/take';break;
    case 'cm':var ym=(view.cym||today().slice(0,7)).split('-');view.cym=iso(new Date(Date.UTC(+ym[0],+ym[1]-1+ +b.dataset.d,1))).slice(0,7);cMonthly();break;
    case 'csv':cCSV();break;
    case 'repl':openReplace(+id);break;
    case 'replOk':replaceLearners(+id);break;
    case 'newA':openNewA();break;
    case 'saveA':saveA();break;
    case 'paste':openPaste();break;
    case 'prev':pastePreview();break;
    case 'apply':pasteApply();break;
    case 'sheetCsv':sheetCsv();break;
    case 'rf':view.rf=b.dataset.f;renderRepairs();break;
    case 'newR':openNewRepair();break;
    case 'urg':view.urg=b.dataset.u;document.querySelectorAll('#urgSeg button').forEach(function(x){x.classList.toggle('on',x===b)});break;
    case 'saveR':saveRepair();break;
    case 'step':openStep(+id,b.dataset.s);break;
    case 'saveStep':saveStep(+id,b.dataset.s);break;
    case 'em':var m=(view.em||today().slice(0,7)).split('-');view.em=iso(new Date(Date.UTC(+m[0],+m[1]-1+ +b.dataset.d,1))).slice(0,7);renderExpenses();break;
    case 'newE':openNewExpense();break;
    case 'saveE':saveExpense();break;
    case 'ecsv':expCSV();break;
    case 'slip':var ex=S.ops.expenses.filter(function(x){return x.id===+id})[0];modal(X+'<h3>Slip</h3><img src="'+ex.photo+'" alt="Slip" style="width:100%;border-radius:12px">');break;
  }
});
document.addEventListener('input',function(e){var t=e.target;if(t.classList&&t.classList.contains('mk'))mInput(t);
  if(t.dataset&&t.dataset.ckey!=null){SC().comments[t.dataset.ckey]=t.textContent.trim();save()}
  if(t.dataset&&t.dataset.pkey!=null){SC().pcomments[t.dataset.pkey]=t.textContent.trim();save()}});
document.addEventListener('keydown',function(e){var t=e.target;if(e.key==='Enter'&&t.classList&&t.classList.contains('mk')){e.preventDefault();var n=$('#mk'+(+t.dataset.i+1));if(n){n.focus();n.select()}else t.blur()}});

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act, id=b.dataset.id!=null?+b.dataset.id:null;
  if(a==='bg'){if(e.target===b)closeModal();return}
  switch(a){
    case 'close':closeModal();break;
    case 'setst':setSt(id,b.dataset.st);break;
    case 'qt':$('#lt').value=b.dataset.t;break;
    case 'okLate':var v=$('#lt').value;if(!v){toast('Choose an arrival time');return}view.draft.items[id]={st:'late',in:v};closeModal();drawTake();break;
    case 'rs':view.rs=b.dataset.r;document.querySelectorAll('#rsGrid button').forEach(function(x){x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b)});break;
    case 'okReason':view.draft.items[id]={st:b.dataset.st,reason:view.rs,note:$('#rsNote').value.trim()};closeModal();drawTake();break;
    case 'sameY':sameAsYesterday();break;
    case 'allP':markAllPresent();break;
    case 'saveReg':PILL.t=Date.now();saveRegister();break;
    case 'tday':var nd=view.draft.d;for(var i=0;i<14;i++){nd=addDays(nd,+b.dataset.d);if(isSchoolDay(nd))break}changeTakeDate(nd);break;
    case 'ttoday':changeTakeDate(today());break;
    case 'share':openShare();break;
    case 'copySum':copyText(summaryText(view.draft?view.draft.d:today()));break;
    case 'nshare':navigator.share({title:'Staff register',text:summaryText(view.draft.d)}).catch(function(){});break;
    case 'openTake':e.preventDefault();var td=b.dataset.d;if(td!==(view.draft&&view.draft.d)){view.draft=null}view.takeDate=td;if(location.hash==='#take')route();else location.hash='#take';break;
    case 'pick':openTeacherSheet(id);break;
    case 'signin':doSign(id,'in');break;
    case 'signout':doSign(id,'out');break;
    case 'markOut':markOut(id);break;
    case 'key':pinKey(b.dataset.k);break;
    case 'filter':view.filter=b.dataset.f===view.filter?'all':b.dataset.f;renderToday();break;
    case 'gotoday':view.date=null;renderToday();break;
    case 'edit':openEdit(id,b.dataset.d);break;
    case 'mode':setMode(b.dataset.m);break;
    case 'saveEdit':saveEdit();break;
    case 'month':var ym=(view.ym||today().slice(0,7)).split('-'),dt=new Date(Date.UTC(+ym[0],+ym[1]-1+ +b.dataset.d,1));view.ym=iso(dt).slice(0,7);renderRegister();break;
    case 'print':window.print();break;
    case 'csv':exportCSV(false);break;
    case 'csv2':exportCSV(true);break;
    case 'lock':adminOk=false;sessionStorage.removeItem('adminOk');route();toast('Locked');break;
    case 'reset':if(confirm('Reset all data to the original records? Changes on this device will be replaced.')){var s0=S.settings;seed();['schoolName','tagline','keeper'].forEach(function(k){S.settings[k]=s0[k]});save();view={};location.hash='#take';route();toast('Data reset')}break;
    case 'wipe':if(confirm('Clear ALL attendance data and start a real register from today?')){S.records={};S.saved={};S.demo=false;S.startDate=today();save();view={};route();toast('All data cleared')}break;
  }
});
document.addEventListener('change',function(e){if(view.name==='settings')settingsChange(e)});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&$('#modalRoot').innerHTML)closeModal();
  if(view.name&&needsLock(view.name)&&!$('#modalRoot').innerHTML){if(/^[0-9]$/.test(e.key))pinKey(e.key);else if(e.key==='Backspace')pinKey('b')}
  if(e.key==='Enter'&&e.target.id==='tpin'){var btn=$('#modalRoot [data-act=signin],#modalRoot [data-act=signout]');btn&&btn.click()}
});
window.addEventListener('beforeunload',function(e){if((view.name==='take'&&dirty())||(view.name==='classes'&&cDirty())||(view.name==='boarding'&&bDirty())){e.preventDefault();e.returnValue=''}});
window.addEventListener('hashchange',route);
var lastDate;
setInterval(function(){header();if(new Date().getMinutes()%30===0&&new Date().getSeconds()<10)loadHijriFeed();var d=today();if(lastDate&&d!==lastDate&&!$('#modalRoot').innerHTML&&!dirty()){view.draft=null;view.takeDate=null;route()}lastDate=d},10000);
load();pwa();lastDate=today();route();loadHijriFeed();
})();
</script>

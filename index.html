<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1f1a">
<title>Staff Attendance Register</title>
<style>
:root{
  --g:#14453a;--g2:#1d5c4c;--g3:#e8efe9;--gold:#C9A227;--gold2:#B8860B;--goldbg:#fbf4dc;--goldink:#5a4100;--base:#0d1f1a;--bg:#f3f6f4;--card:#fff;--ink:#13201c;--muted:#56665f;--line:#dde5e1;
  --p:#16794a;--pbg:#e1f3e8;--l:#9a5600;--lbg:#fff0d4;--a:#b42318;--abg:#fde6e3;--v:#3446a8;--vbg:#e6e9fc;--n:#56665f;--nbg:#edf1ef;
  --r:14px;--sh:0 1px 2px rgba(16,40,32,.06),0 4px 14px rgba(16,40,32,.06);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.hidden{display:none!important}
/* header */
header.top{background:linear-gradient(135deg,#0a1713 0%,#0f2a22 55%,#163d31 100%);color:#fff;border-bottom:3px solid var(--gold);padding:14px 16px 16px;padding-top:max(14px,env(safe-area-inset-top))}
.top-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.crest{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.logo{width:56px;height:56px;border-radius:14px;background:#fff;object-fit:contain;padding:3px;flex:none;box-shadow:0 0 0 2px var(--gold)}
.logo.lg{width:120px;height:120px;border-radius:20px;padding:6px;box-shadow:0 0 0 2px var(--gold),0 6px 18px rgba(0,0,0,.08)}
.brand .tag{font-size:.8rem;color:#e9d48a;letter-spacing:.02em}
.clock b{color:#f3dc8c}
.brand{flex:1;min-width:0}
.brand h1{font-size:1.05rem;margin:0;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.brand .sub{font-size:.8rem;opacity:.85;margin-top:1px}
.clock{text-align:right;font-variant-numeric:tabular-nums}
.clock b{font-size:1.35rem;display:block;line-height:1.1}
.clock span{font-size:.78rem;opacity:.85}
.demo-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(201,162,39,.18);border:1px solid rgba(201,162,39,.6);color:#f3dc8c;font-size:.7rem;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:2px;text-transform:uppercase}
/* nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(0,0,0,.05)}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;text-decoration:none;color:var(--muted);font-size:.74rem;font-weight:600;min-height:58px;justify-content:center}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current=page]{color:var(--g)}
nav.tabs a[aria-current=page] svg{background:var(--goldbg);box-shadow:inset 0 0 0 1px #e6cf7e;border-radius:99px;padding:2px 12px;width:48px;box-sizing:content-box;margin:-2px 0}
nav.tabs .lock-ic{width:11px;height:11px;margin-left:2px}
main{max-width:1180px;margin:0 auto;padding:16px 14px 100px}
@media(min-width:860px){
  nav.tabs{position:sticky;top:0;bottom:auto;justify-content:center;gap:4px;border-top:0;border-bottom:1px solid var(--line);padding:0 16px;box-shadow:none}
  nav.tabs a{flex:none;flex-direction:row;gap:8px;font-size:.92rem;padding:0 18px;min-height:54px;border-bottom:3px solid transparent}
  nav.tabs a svg{width:20px;height:20px}
  nav.tabs a[aria-current=page]{border-bottom-color:var(--gold)}
  nav.tabs a[aria-current=page] svg{background:none;box-shadow:none;padding:0;width:20px;margin:0;color:var(--gold2)}
  main{padding:24px 24px 60px}
  .brand h1{font-size:1.25rem}
}
/* generic */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line)}
.pad{padding:16px}
h2.title{font-size:1.3rem;margin:4px 0 4px}
p.lead{margin:0 0 14px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 16px;min-height:46px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:#f7faf8}
.btn.primary{background:linear-gradient(180deg,#d4ad34,#C9A227);border-color:#b08a14;color:#1c1503;box-shadow:0 1px 0 rgba(255,255,255,.4) inset}
.btn.primary:hover{background:#B8860B;color:#140f02}
.btn.danger{color:var(--a);border-color:#f2c5bf}
.btn.big{min-height:60px;font-size:1.1rem;width:100%;border-radius:14px}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.88rem}
.btn svg{width:18px;height:18px}
.input{width:100%;border:1px solid #cbd6d1;border-radius:12px;padding:12px 14px;min-height:48px;background:#fff}
.input:focus{border-color:var(--gold2);outline:3px solid rgba(201,162,39,.25)}
label.f{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin:12px 0 6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-present{color:var(--p);background:var(--pbg)}.s-late{color:var(--l);background:var(--lbg)}.s-absent{color:var(--a);background:var(--abg)}.s-leave{color:var(--v);background:var(--vbg)}.s-notyet,.s-none{color:var(--n);background:var(--nbg)}
.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:1rem;letter-spacing:.02em;position:relative}
.avatar.lg{width:84px;height:84px;font-size:1.7rem}
.avatar.sm{width:38px;height:38px;font-size:.85rem}
.avatar i{position:absolute;right:-1px;bottom:-1px;width:15px;height:15px;border-radius:50%;border:3px solid #fff}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.tnum{font-variant-numeric:tabular-nums}
/* sign-in grid */
.search{position:relative;margin-bottom:14px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.search .input{padding-left:44px;font-size:1.05rem;min-height:54px;border-radius:14px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:16px 10px 14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);min-height:132px}
.tcard:hover{border-color:#a9cbbf}
.tcard .nm{font-weight:650;font-size:.95rem;line-height:1.25}
.tcard .st{font-size:.76rem;color:var(--muted)}
@media(max-width:420px){.tgrid{grid-template-columns:1fr 1fr}}
.greet{display:flex;align-items:flex-end;gap:10px;margin-bottom:12px;flex-wrap:wrap}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,25,20,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .2s ease-out}
@media(min-width:600px){.overlay{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}@keyframes fade{from{opacity:0}}
.sheet h3{margin:6px 0 2px;font-size:1.3rem}
.sheet .center{text-align:center;display:flex;flex-direction:column;align-items:center}
.close-x{float:right;border:0;background:var(--nbg);border-radius:50%;width:40px;height:40px;display:grid;place-items:center}
.ok-ic{width:76px;height:76px;border-radius:50%;background:var(--pbg);color:var(--p);box-shadow:0 0 0 3px var(--gold);display:grid;place-items:center;margin:6px auto 8px}
.ok-ic svg{width:40px;height:40px}
.bigtime{font-size:2.6rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;width:100%}
.kv div{background:var(--bg);border-radius:12px;padding:10px 12px;text-align:left}
.kv small{display:block;color:var(--muted);font-size:.76rem;font-weight:600}
.kv b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.notice{background:var(--lbg);color:#6b3c00;border-radius:12px;padding:10px 12px;font-size:.9rem;margin:8px 0;width:100%;text-align:left}
/* pin */
.pin-dots{display:flex;gap:14px;justify-content:center;margin:16px 0}
.pin-dots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--gold2);}
.pin-dots span.on{background:var(--gold)}
.pad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.pad-grid button{height:64px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:1.5rem;font-weight:600}
.pad-grid button:active{background:var(--goldbg)}
.lock{max-width:420px;margin:20px auto;text-align:center}
.demo-pin{display:inline-block;background:var(--goldbg);color:var(--goldink);border:1px solid #e6cf7e;font-weight:700;padding:6px 14px;border-radius:99px;margin-top:6px}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* dashboard */
.counters{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
@media(min-width:620px){.counters{grid-template-columns:repeat(5,1fr)}}
.counter{padding:14px;border-radius:var(--r);background:#fff;border:1px solid var(--line);box-shadow:var(--sh);text-align:left;border-left:5px solid currentColor}
.counter b{display:block;font-size:2rem;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.counter span{font-size:.85rem;font-weight:650}
.counter.on{outline:2px solid currentColor}
.counter:nth-child(5){grid-column:span 2}@media(min-width:620px){.counter:nth-child(5){grid-column:auto}}
.list{list-style:none;margin:0;padding:0}
.li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .who{flex:1;min-width:0}
.li .who>a b,.li .who>b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .times{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.li .audit{font-size:.76rem;color:var(--v);margin-top:3px}
.li a.nm{color:inherit;text-decoration:none}.li a.nm:hover{text-decoration:underline}
.li .act{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.dash-head{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.date-in{max-width:190px;min-height:46px}
.dash-head .row{flex-wrap:nowrap}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:44px;font-weight:650}
.seg button.on{background:#fff;box-shadow:var(--sh),inset 0 -3px 0 var(--gold);color:var(--g)}
/* register */
.reg-wrap{overflow:auto;border-radius:var(--r);border:1px solid var(--line);background:#fff;box-shadow:var(--sh);max-height:72vh}
table.reg{border-collapse:separate;border-spacing:0;font-size:.82rem;width:100%}
table.reg th,table.reg td{border-bottom:1px solid var(--line);border-right:1px solid #edf1ef;padding:0;text-align:center;height:38px;min-width:34px}
table.reg thead th{position:sticky;top:0;background:#f7faf8;z-index:2;font-weight:650;padding:6px 2px;line-height:1.1}
table.reg thead th small{display:block;color:var(--muted);font-weight:500;font-size:.68rem}
table.reg th.name,table.reg td.name{position:sticky;left:0;background:#fff;z-index:1;text-align:left;padding:0 10px;min-width:150px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;border-right:2px solid var(--line)}
table.reg thead th.name{z-index:3;background:#f7faf8}
table.reg td.name a{color:inherit;text-decoration:none}
table.reg th.tot,table.reg td.tot{background:#f7faf8;font-weight:700;min-width:40px}
table.reg th.today{color:var(--g);background:var(--goldbg);box-shadow:inset 0 -3px 0 var(--gold)}
.c{display:inline-grid;place-items:center;width:28px;height:26px;border-radius:7px;font-weight:700;font-size:.74rem}
.c-P{background:var(--pbg);color:var(--p)}.c-L{background:var(--lbg);color:var(--l)}.c-A{background:var(--abg);color:var(--a)}.c-Lv{background:var(--vbg);color:var(--v)}.c-N{color:#9aa8a2}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin:12px 0}
.legend span{display:inline-flex;gap:6px;align-items:center}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav b{min-width:140px;text-align:center;font-size:1.05rem}
.print-only{display:none}
/* teacher */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
@media(min-width:700px){.stats{grid-template-columns:repeat(6,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.stat b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted);font-weight:600}
.ring{--v:0;width:110px;height:110px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--v)*1%),#ece6d2 0);display:grid;place-items:center;flex:none}
.ring div{width:84px;height:84px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:1.3rem}
.strip{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.strip i{width:18px;height:18px;border-radius:5px;display:block}
.grid2{display:grid;gap:14px}
@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
/* settings */
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;background:#fff;font-weight:600}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.switch input{width:52px;height:30px;appearance:none;background:#c7d3ce;border-radius:99px;position:relative;cursor:pointer;flex:none;transition:.2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked{background:var(--gold2)}.switch input:checked::after{left:25px}
.pins{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:8px}
.pins div{display:flex;align-items:center;gap:8px;font-size:.88rem}
.pins input{width:80px;min-height:38px;padding:6px 10px;text-align:center;letter-spacing:.2em}
.sec{margin-bottom:14px}
.sec h3{margin:0 0 4px;font-size:1.05rem}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#13201c;color:#fff;padding:12px 18px;border-radius:12px;z-index:60;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:92vw}
footer.foot{text-align:center;color:var(--muted);font-size:.78rem;margin-top:26px}
footer.foot button{background:none;border:0;color:var(--g2);text-decoration:underline;font-weight:600;padding:8px}
/* print */
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;font-size:10pt}
  header.top,nav.tabs,.no-print,footer.foot,.toast,.overlay{display:none!important}
  main{padding:0;max-width:none}
  .print-only{display:block}
  .reg-wrap{max-height:none;overflow:visible;box-shadow:none;border:1px solid #999;border-radius:0}
  table.reg{font-size:7.5pt}
  table.reg th,table.reg td{height:20px;min-width:0;border-color:#bbb}
  table.reg th.name,table.reg td.name{position:static;min-width:0;max-width:none;font-size:8pt}
  table.reg thead th{position:static}
  .c{width:auto;height:auto;padding:1px 3px;font-size:7pt}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ph{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:2.5px solid #C9A227;padding-bottom:6px;margin-bottom:8px}
  .ph img{width:62px;height:62px;object-fit:contain}
  .ph .pt{flex:1}
  .ph h1{margin:0;font-size:15pt;color:#14453a}
  .ph .ptag{font-size:9pt;color:#6b5000;letter-spacing:.03em;text-transform:uppercase}.ph p{margin:0}
  .sig{display:flex;gap:40px;margin-top:28px;font-size:10pt}
  .sig div{flex:1;border-top:1px solid #000;padding-top:4px}
  .legend{margin:6px 0}
}
</style>
</head>
<body>

<script>
(function(){
"use strict";
var TZ='Africa/Johannesburg', KEY='staffRegister.v1';
var TEACHERS=["Ahmed Jeewa","Asaamu","Asad Mohammed Msiza","Fahima Mayet","Imraan Joosub","Khalid Ayob","Mahmood Desai","Mohamed Elsayed Atia","Mohamed Naeem Nombewu","Mohammad Hoosein Akhalwaya","Muhammad Ashraf E Dockrat","Muhammad Binyamin","Muhammed Desai","Muhammed S dockrat","Nafisa Amod","Nazreen Dada","Samir Mall","Sumaiya Cassim","Yusuf Suliman","Zubair Ismail"];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var COLORS=['#0f6b5a','#2f6f9f','#7a4fa0','#a0522d','#3b7d3b','#b0466a','#5a6b2f','#2b5d8a','#8a5a00','#4b5aa8'];
var STATUS_LABEL={present:'Present',late:'Late',absent:'Absent',leave:'On leave',notyet:'Not yet in',none:'—'};
var REASONS=['Sick','Family responsibility','Annual','Other'];
var DEF_NAME='Darul Uloom @ Darus Salaam', DEF_TAG='For Higher Islamic Education';
var S, view={}, adminOk=sessionStorage.getItem('adminOk')==='1';

/* ---------- time helpers (always South Africa time) ---------- */
function now(){
  var p={};new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).forEach(function(x){p[x.type]=x.value});
  var h=p.hour==='24'?'00':p.hour;
  return {date:p.year+'-'+p.month+'-'+p.day,time:h+':'+p.minute,sec:p.second};
}
function pd(iso){var a=iso.split('-');return new Date(Date.UTC(+a[0],+a[1]-1,+a[2]))}
function iso(d){return d.toISOString().slice(0,10)}
function addDays(s,n){var d=pd(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)}
function dow(s){return pd(s).getUTCDay()}
function fmtDate(s){var a=s.split('-');return a[2]+' '+MON[+a[1]-1]+' '+a[0]}
function fmtDateW(s){return DOW[dow(s)]+' '+fmtDate(s)}
function isSchoolDay(s){return S.settings.days.indexOf(dow(s))>-1}
function today(){return now().date}
function stamp(){var n=now();return fmtDate(n.date)+' '+n.time}
function toMin(t){var a=t.split(':');return +a[0]*60+ +a[1]}
function fromMin(m){m=Math.round(m);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function initials(n){var w=n.trim().split(/\s+/);return (w[0][0]+(w.length>1?w[w.length-1][0]:(w[0][1]||''))).toUpperCase()}
function firstName(n){return n.split(' ')[0]}
function avatar(t,cls,dot){return '<span class="avatar '+(cls||'')+'" style="background:'+COLORS[t.id%COLORS.length]+'" aria-hidden="true">'+esc(initials(t.name))+(dot?'<i style="background:'+dot+'"></i>':'')+'</span>'}

/* ---------- storage ---------- */
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}if(!S||!S.teachers)seed();if(S.settings.schoolName==='Your School Name')S.settings.schoolName=DEF_NAME;if(S.settings.tagline==null)S.settings.tagline=DEF_TAG}
function defaults(){return {schoolName:DEF_NAME,tagline:DEF_TAG,start:'07:30',late:'07:45',days:[1,2,3,4,5],pinOn:false,adminPin:'1234'}}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seed(){
  var r=rng(20261022), t0=today(), n=now();
  S={v:1,demo:true,settings:defaults(),teachers:TEACHERS.map(function(name,i){return{id:i,name:name,pin:String(1000+((i*7919+137)%9000)).slice(-4)}}),records:{}};
  var start=addDays(t0,-21); S.startDate=start;
  var lateProne={2:.28,8:.22,13:.25,16:.18};
  var planned={}; // date offset (days before today) -> {teacher:{status,reason,note}}
  function plan(back,tid,o){var d=addDays(t0,-back);(planned[d]=planned[d]||{})[tid]=o}
  plan(20,4,{status:'leave',reason:'Sick',note:'Flu – doctor\'s note received'});plan(19,4,{status:'leave',reason:'Sick',note:'Flu – doctor\'s note received'});
  plan(14,13,{status:'leave',reason:'Annual',note:'Pre-approved'});plan(13,13,{status:'leave',reason:'Annual',note:'Pre-approved'});plan(12,13,{status:'leave',reason:'Annual',note:'Pre-approved'});
  plan(8,9,{status:'leave',reason:'Family responsibility',note:'Family funeral (janazah)'});
  plan(6,16,{status:'absent',reason:'Other',note:'No contact made'});
  plan(15,11,{status:'absent',reason:'Sick',note:'Phoned in at 06:50'});
  plan(1,17,{status:'leave',reason:'Sick',note:''});
  for(var d=start;d<t0;d=addDays(d,1)){
    if(!isSchoolDay(d))continue;
    var day=S.records[d]={}, fri=dow(d)===5;
    S.teachers.forEach(function(t){
      var p=planned[d]&&planned[d][t.id];
      if(p){day[t.id]={status:p.status,reason:p.reason,note:p.note};return}
      var lp=lateProne[t.id]||.035, inM;
      if(r()<lp) inM=toMin('07:46')+r()*28; else inM=toMin('06:58')+r()*40;
      var outM=fri?toMin('12:15')+r()*25:toMin('14:05')+r()*70;
      day[t.id]={status:'in',in:fromMin(inM),out:fromMin(outM)};
    });
  }
  // a couple of audited corrections for realism
  var dA=addDays(t0,-5); while(!isSchoolDay(dA))dA=addDays(dA,-1);
  if(S.records[dA]&&S.records[dA][5]){S.records[dA][5].in='07:20';S.records[dA][5].audit=[{at:fmtDate(dA)+' 09:12',text:'Sign-in time corrected 07:55 → 07:20 (signed in late at office, was on duty at gate)'}]}
  // today
  if(isSchoolDay(t0)&&n.time>='07:00'){
    var day=S.records[t0]={}, notIn={1:1,15:1,19:1};

   '<div class="dash-head no-print"><div><h2 class="title">Monthly register</h2><p class="lead" style="margin:0">'+days.length+' school days · '+counted+' recorded so far</p></div><div class="spacer"></div>'+
   '<div class="monthnav"><button class="btn sm" data-act="month" data-d="-1" aria-label="Previous month">‹</button><b>'+title+'</b><button class="btn sm" data-act="month" data-d="1" aria-label="Next month">›</button></div></div>'+
   '<div class="row no-print" style="margin:12px 0"><button class="btn primary" data-act="print"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Print register</button><button class="btn" data-act="csv">Export CSV</button><button class="btn" data-act="csv2">Detailed CSV</button></div>'+
   '<div class="legend"><span><span class="c c-P">P</span>Present</span><span><span class="c c-L">L</span>Late (counted as present)</span><span><span class="c c-A">A</span>Absent</span><span><span class="c c-Lv">Lv</span>On leave</span><span><span class="c c-N">·</span>No record</span></div>'+
   '<div class="reg-wrap"><table class="reg"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'+
   '<div class="print-only sig"><div>Principal signature</div><div>Name</div><div>Date</div></div>'+footer();
}
function download(name,text){var b=new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000)}
function csvRow(a){return a.map(function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')}
function slug(){return (S.settings.schoolName||'school').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()}
function exportCSV(detailed){
  var ym=view.ym||today().slice(0,7), days=monthDays(ym), lines=[];
  if(!detailed){
    lines.push(csvRow(['Teacher'].concat(days.map(fmtDate),['Present','Late','Absent','Leave','Attendance %'])));
    S.teachers.forEach(function(x){var t=totals(x.id,days);lines.push(csvRow([x.name].concat(days.map(function(d){return CODE[statusOf(d,x.id)]}),[t.P,t.L,t.A,t.Lv,t.pct==null?'':t.pct])))});
  } else {
    lines.push(csvRow(['Date','Teacher','Status','Sign in','Sign out','Reason','Note','Last change']));
    days.forEach(function(d){S.teachers.forEach(function(x){var st=statusOf(d,x.id);if(st==='none')return;var r=rec(d,x.id)||{};lines.push(csvRow([fmtDate(d),x.name,STATUS_LABEL[st],r.in,r.out,r.reason,r.note,r.audit&&r.audit.length?r.audit[r.audit.length-1].text:'']))})});
  }
  var name=slug()+'-register-'+ym+(detailed?'-detailed':'')+'.csv';
  download(name,lines.join('\r\n'));toast('Downloaded '+name);
  window.__lastCSV={name:name,text:lines.join('\r\n')};
}

/* ---------- Teacher summary ---------- */
function renderTeacher(){
  var id=+view.arg, x=S.teachers[id];if(!x){location.hash='#today';return}
  var t=today(), days=[];
  for(var d=S.startDate||t;d<=t;d=addDays(d,1))if(isSchoolDay(d))days.push(d);
  var tt=totals(id,days), ins=[];
  days.forEach(function(d){var r=rec(d,id);if(r&&r.in&&r.status==='in')ins.push(toMin(r.in))});
  var avg=ins.length?fromMin(ins.reduce(function(a,b){return a+b},0)/ins.length):'—';
  var recent=days.slice().reverse().slice(0,15);
  var tr=rec(t,id)||{};
  $('#main').innerHTML='<p class="no-print" style="margin:0 0 10px"><a href="#today" style="color:var(--g);font-weight:600;text-decoration:none">‹ Back to Today</a></p>'+
   '<div class="card pad row" style="gap:16px">'+avatar(x,'lg')+'<div style="flex:1;min-width:180px"><h2 class="title" style="margin:0">'+esc(x.name)+'</h2><div class="muted">Today: '+STATUS_LABEL[statusOf(t,id)]+(tr.in?' · in '+tr.in:'')+(tr.out?' · out '+tr.out:'')+'</div><div class="row" style="margin-top:10px"><button class="btn sm primary" data-act="edit" data-id="'+id+'" data-d="'+t+'">Edit today / mark leave</button></div></div>'+
   '<div class="ring" style="--v:'+(tt.pct||0)+'" role="img" aria-label="Attendance '+(tt.pct==null?'n/a':tt.pct+'%')+'"><div>'+(tt.pct==null?'–':tt.pct+'%')+'</div></div></div>'+
   '<p class="muted small" style="margin:10px 2px 0">Since '+fmtDate(S.startDate||t)+' · '+tt.n+' school days</p>'+
   '<div class="stats"><div class="stat"><b>'+tt.P+'</b><span>Days present</span></div><div class="stat"><b>'+tt.L+'</b><span>Late arrivals</span></div><div class="stat"><b>'+tt.A+'</b><span>Absent</span></div><div class="stat"><b>'+tt.Lv+'</b><span>On leave</span></div><div class="stat"><b>'+(tt.n?Math.round((tt.P-tt.L)/tt.n*100):0)+'%</b><span>On time</span></div><div class="stat"><b>'+avg+'</b><span>Avg. sign-in (on-time days)</span></div></div>'+
   '<div class="card pad" style="margin-bottom:14px"><b>Pattern</b><div class="strip" aria-hidden="true">'+days.map(function(d){return '<i title="'+fmtDate(d)+'" style="background:'+dotColor(statusOf(d,id))+'"></i>'}).join('')+'</div></div>'+
   '<div class="card"><div class="pad" style="padding-bottom:4px"><b>Recent history</b></div><ul class="list">'+recent.map(function(d){var r=rec(d,id)||{},st=statusOf(d,id);return '<li class="li"><div class="who"><b class="tnum">'+fmtDateW(d)+'</b><div class="times">'+(r.in?'In '+r.in+(r.out?' · Out '+r.out+' ('+dur(r.in,r.out)+')':''):(r.reason?esc(r.reason)+(r.note?' – '+esc(r.note):''):'—'))+'</div>'+(r.audit&&r.audit.length?'<div class="audit">✎ '+esc(r.audit[r.audit.length-1].text)+'</div>':'')+'</div><div class="act">'+chip(st)+'<button class="btn sm" data-act="edit" data-id="'+id+'" data-d="'+d+'">Edit</button></div></li>'}).join('')+'</ul></div>'+footer();
}

/* ---------- Settings ---------- */
function renderSettings(){
  var s=S.settings;
  $('#main').innerHTML='<h2 class="title">Settings</h2><p class="lead">Changes save automatically on this device.</p><div class="grid2"><div>'+
   '<div class="card pad sec"><h3>School</h3><label class="f" for="sName">School name (shown in header and on printouts)</label><input class="input" id="sName" maxlength="80" value="'+esc(s.schoolName)+'"><label class="f" for="sTag">Tagline</label><input class="input" id="sTag" maxlength="100" value="'+esc(s.tagline||'')+'"></div>'+
   '<div class="card pad sec"><h3>School hours</h3><div class="row" style="flex-wrap:nowrap"><div style="flex:1"><label class="f" for="sStart">School starts</label><input class="input" type="time" id="sStart" value="'+s.start+'"></div><div style="flex:1"><label class="f" for="sLate">Late after</label><input class="input" type="time" id="sLate" value="'+s.late+'"></div></div>'+
   '<label class="f">School days</label><div class="days">'+[1,2,3,4,5,6,0].map(function(d){return '<label><input type="checkbox" data-day="'+d+'"'+(s.days.indexOf(d)>-1?' checked':'')+'> '+DOW[d]+'</label>'}).join('')+'</div></div>'+
   '<div class="card pad sec"><h3>Demo data</h3><p class="muted small" style="margin:0 0 10px">'+(S.demo?'This register is filled with about 3 weeks of example attendance so you can explore every screen.':'Example data has been cleared. The register only holds real entries made on this device.')+'</p><div class="row"><button class="btn" data-act="reset">Reset demo data</button><button class="btn danger" data-act="wipe">Clear all &amp; start fresh</button></div></div>'+
   '</div><div>'+
   '<div class="card pad sec"><h3>Security</h3><div class="switch"><div><b>Teacher PINs</b><div class="muted small">Ask each teacher for a 4-digit PIN when signing in. Off for the demo.</div></div><input type="checkbox" id="sPin" aria-label="Require teacher PIN"'+(s.pinOn?' checked':'')+'></div>'+
   '<div id="pinList" class="'+(s.pinOn?'':'hidden')+'"><div class="pins">'+S.teachers.map(function(x){return '<div><input class="input" data-pin="'+x.id+'" inputmode="numeric" maxlength="4" value="'+x.pin+'" aria-label="PIN for '+esc(x.name)+'"><span>'+esc(x.name)+'</span></div>'}).join('')+'</div></div>'+
   '<label class="f" for="sAdmin">Admin PIN</label><input class="input" id="sAdmin" inputmode="numeric" maxlength="4" value="'+esc(s.adminPin)+'" style="max-width:140px;letter-spacing:.3em;text-align:center"><div class="row" style="margin-top:12px"><button class="btn" data-act="lock">Lock admin now</button></div></div>'+
   '<div class="card pad sec"><h3>Staff list</h3><p class="muted small" style="margin:0">'+S.teachers.length+' teachers. In the full version staff can be added, edited and archived here.</p></div>'+
   '</div></div>'+footer();
}
function settingsChange(e){
  var el=e.target, s=S.settings;
  if(el.id==='sName')s.schoolName=el.value.trim()||DEF_NAME;
  else if(el.id==='sTag')s.tagline=el.value.trim();
  else if(el.id==='sStart'&&el.value)s.start=el.value;
  else if(el.id==='sLate'&&el.value)s.late=el.value;
  else if(el.dataset.day!=null){s.days=[].slice.call(document.querySelectorAll('[data-day]:checked')).map(function(c){return +c.dataset.day})}
  else if(el.id==='sPin'){s.pinOn=el.checked;$('#pinList').classList.toggle('hidden',!el.checked)}
  else if(el.dataset.pin!=null){if(/^\d{4}$/.test(el.value))S.teachers[+el.dataset.pin].pin=el.value;else{toast('PIN must be 4 digits');el.value=S.teachers[+el.dataset.pin].pin;return}}
  else if(el.id==='sAdmin'){if(/^\d{4}$/.test(el.value))s.adminPin=el.value;else{toast('Admin PIN must be 4 digits');el.value=s.adminPin;return}}
  else return;
  save();header();toast('Saved');
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act, id=b.dataset.id!=null?+b.dataset.id:null;
  if(a==='bg'){if(e.target===b)closeModal();return}
  switch(a){
    case 'close':closeModal();break;
    case 'pick':openTeacherSheet(id);break;
    case 'signin':doSign(id,'in');break;
    case 'signout':doSign(id,'out');break;
    case 'key':pinKey(b.dataset.k);break;
    case 'filter':view.filter=b.dataset.f===view.filter?'all':b.dataset.f;renderToday();break;
    case 'gotoday':view.date=null;renderToday();break;
    case 'edit':openEdit(id,b.dataset.d);break;
    case 'mode':setMode(b.dataset.m);break;
    case 'saveEdit':saveEdit();break;
    case 'month':var ym=(view.ym||today().slice(0,7)).split('-'),dt=new Date(Date.UTC(+ym[0],+ym[1]-1+ +b.dataset.d,1));view.ym=iso(dt).slice(0,7);renderRegister();break;
    case 'print':window.print();break;
    case 'csv':exportCSV(false);break;
    case 'csv2':exportCSV(true);break;
    case 'lock':adminOk=false;sessionStorage.removeItem('adminOk');location.hash='#signin';toast('Admin locked');break;
    case 'reset':if(confirm('Reset to fresh demo data? All changes on this device will be replaced.')){var keep=S.settings.schoolName,kt=S.settings.tagline;seed();S.settings.schoolName=keep;S.settings.tagline=kt;save();view={};route();toast('Demo data reset')}break;
    case 'wipe':if(confirm('Clear ALL attendance data and start a real register from today?')){S.records={};S.demo=false;S.startDate=today();save();route();toast('All data cleared')}break;
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&$('#modalRoot').innerHTML)closeModal();
  if(view.name&&ADMIN_VIEWS[view.name]&&!adminOk&&!$('#modalRoot').innerHTML){if(/^[0-9]$/.test(e.key))pinKey(e.key);else if(e.key==='Backspace')pinKey('b')}
  if(e.key==='Enter'&&e.target.id==='tpin'){var btn=$('#modalRoot [data-act=signin],#modalRoot [data-act=signout]');btn&&btn.click()}
});
document.addEventListener('change',function(e){if(view.name==='settings')settingsChange(e)});
window.addEventListener('hashchange',route);
var lastDate;
setInterval(function(){header();var d=today();if(lastDate&&d!==lastDate&&!$('#modalRoot').innerHTML)route();lastDate=d},10000);
load();lastDate=today();route();
})();
</script>
</body>
